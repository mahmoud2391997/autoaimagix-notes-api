services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notesapi
      POSTGRES_DB: notesapi
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run setup:local first}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notesapi -d notesapi']
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
