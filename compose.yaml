services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notesapi
      POSTGRES_DB: notesapi
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run setup:local first}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notesapi -d notesapi']
      interval: 2s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15
  redis-rest:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${LOCAL_REDIS_TOKEN:?Run npm run setup:local first}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '127.0.0.1:8079:80'
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data:
  postgres_data:
